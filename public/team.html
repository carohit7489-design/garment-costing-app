<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Production Team - Design &amp; Execution</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .tab-bar {
    display: flex;
    gap: 8px;
    max-width: 1500px;
    margin: 16px auto 0;
    padding: 0 20px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: #fff;
    color: var(--navy);
    border: 1px solid var(--navy-light);
    padding: 10px 18px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: bold;
  }
  .tab-btn.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .tab-frame-wrap {
    max-width: 1500px;
    margin: 12px auto 0;
    padding: 0 20px 40px;
  }
  iframe.tab-frame {
    width: 100%;
    height: calc(100vh - 170px);
    min-height: 500px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    display: none;
  }
  iframe.tab-frame.active { display: block; }
</style>
</head>
<body>
<header class="top">
  <h1>Garment Costing Module</h1>
  <nav>
    <a href="owner.html">Design &amp; Costing</a>
    <a href="production.html">Production - Actual Consumption</a>
    <a href="approver.html">Approver Review</a>
    <a href="inventory.html">Inventory Dashboard</a>
    <a href="workspace.html">Owner (Approval/Review/Reporting)</a>
    <a href="team.html" class="active">Production Team (Design/Execution)</a>
  </nav>
</header>

<div class="tab-bar">
  <button class="tab-btn active" type="button" data-tab="design">Design &amp; Costing</button>
  <button class="tab-btn" type="button" data-tab="production">Actual Production</button>
</div>

<div class="tab-frame-wrap">
  <iframe class="tab-frame active" data-tab="design" src="owner.html?embed=1" title="Design & Costing"></iframe>
  <iframe class="tab-frame" data-tab="production" src="production.html?embed=1" title="Production - Actual Consumption"></iframe>
</div>

<script>
  // Each tab is the existing standalone page in its own iframe - switching
  // tabs only toggles which iframe is visible, no top-level navigation, so
  // nothing reloads and each tab keeps its own state (selected style, etc.)
  // while you're away from it.
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".tab-frame").forEach((f) => f.classList.remove("active"));
      btn.classList.add("active");
      document.querySelector(`.tab-frame[data-tab="${btn.dataset.tab}"]`).classList.add("active");
    });
  });
</script>
</body>
</html>
